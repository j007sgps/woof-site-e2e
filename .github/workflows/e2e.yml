# 功能測試（頁面、hreflang、語言切換、主題、手機、數字表）
name: e2e

on:
  # 網站部署完成時（由網站 repo 的 workflow 送過來）
  repository_dispatch:
    types: [site-deployed]
  # 每天日本時間早上（也抓得到網站以外的變化）
  schedule:
    - cron: '13 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 14
