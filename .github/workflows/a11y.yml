# 所有頁面 × 深色／淺色跑 axe
name: a11y

on:
  # 網站部署完成時（由網站 repo 的 workflow 送過來）
  repository_dispatch:
    types: [site-deployed]
  # 每天日本時間早上（也抓得到網站以外的變化）
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-a11y
          path: playwright-report/
          retention-days: 14
